# Portainer → Stacks → Add stack → name: spl-backend → paste this.
#
# Also fill "Environment variables" in the same Stack UI (see deploy/stack.env.example).
# Portainer substitutes ${VAR} from those values.
#
# BEFORE deploy:
# 1. Build image on the server (or push from laptop):  docker build -t spl-backend:dev2 .
# 2. Set parkpilot_net name to your Postgres container's network.
# 3. Do NOT run a local LLM on this host — use CLOUD_API_KEY + AGENT_ENDPOINT.

services:
  spl-backend:
    image: spl-backend:dev2
    container_name: spl-backend
    restart: unless-stopped
    ports:
      # CAMT rule: host ports must be 11401–11499 (not random 8000).
      # Pick a free one on the server, e.g. 11421. Container stays on 8000 inside.
      - "${HOST_PORT:-11421}:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      SECRET_KEY: "${SECRET_KEY}"
      SEED_USERNAME: "${SEED_USERNAME:-admin}"
      SEED_PASSWORD: "${SEED_PASSWORD}"
      SEED_EMAIL: "${SEED_EMAIL}"
      SQL_ECHO: "false"
      # Keep EMAIL_DISABLED=true until SMTP_* below point at a real relay.
      EMAIL_DISABLED: "${EMAIL_DISABLED:-true}"
      SMTP_HOST: "${SMTP_HOST:-localhost}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-parkpilot@camt.cmu.ac.th}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-15}"
      # Report send time is container-local (UTC unless the image carries tzdata).
      WEEKLY_REPORT_DAY: "${WEEKLY_REPORT_DAY:-mon}"
      WEEKLY_REPORT_HOUR: "${WEEKLY_REPORT_HOUR:-8}"
      WEEKLY_REPORT_MINUTE: "${WEEKLY_REPORT_MINUTE:-0}"

      CLOUD_API_KEY: "${CLOUD_API_KEY}"
      AGENT_ENDPOINT: "${AGENT_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}"

      MCP_HTTP_ENABLED: "true"
      MCP_API_TOKENS: "${MCP_API_TOKENS}"
      MCP_LINE_BOT_TOKEN: "${MCP_LINE_BOT_TOKEN}"
      MCP_INTERNAL_URL: "http://127.0.0.1:8000/mcp/"
      MCP_INTERNAL_MODE: "http"
      MCP_RATE_LIMIT_PER_MINUTE: "${MCP_RATE_LIMIT_PER_MINUTE:-60}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS}"

      ADMIN_LINE_CHANNEL_SECRET: "${ADMIN_LINE_CHANNEL_SECRET}"
      ADMIN_LINE_ACCESS_TOKEN: "${ADMIN_LINE_ACCESS_TOKEN}"
      ADMIN_LINE_LINK_SECRET: "${ADMIN_LINE_LINK_SECRET}"
      ADMIN_PUSH_ALERT_TYPES: "${ADMIN_PUSH_ALERT_TYPES:-device_offline}"

      USER_LINE_CHANNEL_SECRET: "${USER_LINE_CHANNEL_SECRET:-}"
      USER_LINE_ACCESS_TOKEN: "${USER_LINE_ACCESS_TOKEN:-}"

      ANOMALY_SCAN_INTERVAL_MINUTES: "${ANOMALY_SCAN_INTERVAL_MINUTES:-5}"
      ANOMALY_STUCK_SLOT_HOURS: "${ANOMALY_STUCK_SLOT_HOURS:-12}"
      ANOMALY_PIPELINE_INACTIVE_MINUTES: "${ANOMALY_PIPELINE_INACTIVE_MINUTES:-15}"
      ANOMALY_DEVICE_OFFLINE_SECONDS: "${ANOMALY_DEVICE_OFFLINE_SECONDS:-300}"
    mem_limit: 768m
    mem_reservation: 256m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - parkpilot_net

networks:
  parkpilot_net:
    external: true
    # Portainer → Containers → your postgres → Networks → paste that name here
    name: CHANGE_ME_EXISTING_DOCKER_NETWORK
